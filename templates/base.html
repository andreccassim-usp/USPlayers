{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}{% endblock %} | USPlayers
    </title>
    <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="{% static 'style.css' %}">
</head>

<body>
    <header id="cabecalho-principal">
        <article class="logo-base">
            <a href="{% url 'index' %}"> <img src="{% static 'logo.png' %}" alt="Logo USPlayers" height="100"> </a>
        </article>
        <nav id="navegacao-principal">
            <ul>
                <li><a href="{% url 'index' %}" class="botao-link-base">Página Inicial</a></li>
                <li><a href="{% url 'about' %}" class="botao-link-base">Sobre</a></li>
                <li><a href="{% url 'buscar' %}" class="botao-link-base">Buscar</a></li>
                <li><a href="{% url 'comparacao' %}" class="botao-link-base">Comparação</a></li>
                <li><a href="{% url 'login' %}" class="botao-link-base">Login</a></li>
                <li><a href="{% url 'signup' %}" class="botao-link-base">Cadastre-se</a></li>
            </ul>
        </nav>
    </header>

    <main id="conteiner-principal">
        {% block content %}
        {% endblock content %}
    </main>

    <footer id="rodape-principal">
        <p>
            <small>Copyright 2025 - USPlayers</small>
        </p>
    </footer>

</body>

</html>
